name: Source-only Alpha Maintenance

permissions:
  contents: read

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  source_only:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Record source-only maintenance
        run: echo "This legacy fork does not publish packages, tags, or releases."
